// ============================================================
// INIT + AUTH
// ============================================================
async function init() {
  const { data } = await supa.auth.getSession();
  session = data.session;
  if (!session) { renderLogin(); return; }
  await loadProfile();
  if (!profile) { renderNoProfile(); return; }
  await Promise.all([loadCategories(), loadBoards(), loadSiteTexts(), loadSiteImages(), loadBlogPosts()]);
  renderApp();
}

async function loadBlogPosts() {
  const { data, error } = await supa.from('posts').select('*').order('updated_at', { ascending: false });
  if (error) { console.warn(error); return; }
  blogPosts = data || [];
}

async function loadSiteTexts() {
  siteTexts = { pt: {}, en: {}, es: {} };
  const { data, error } = await supa.from('site_texts').select('key,lang,value');
  if (error) { console.warn(error); return; }
  (data || []).forEach(r => { (siteTexts[r.lang] = siteTexts[r.lang] || {})[r.key] = r.value; });
}

async function loadSiteImages() {
  siteImages = {};
  const { data, error } = await supa.from('site_images').select('id,slot,sort_order,image_path').order('sort_order');
  if (error) { console.warn(error); return; }
  (data || []).forEach(r => { (siteImages[r.slot] = siteImages[r.slot] || []).push(r); });
}

async function loadProfile() {
  const { data, error } = await supa.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
  if (error) console.warn(error);
  profile = data;
}

async function loadCategories() {
  const { data, error } = await supa.from('categories').select('slug, name, display_order, active').order('display_order');
  if (error) { console.error(error); return; }
  categories = data || [];
}

async function loadBoards() {
  const { data, error } = await supa.from('boards').select('id, image_path, category_slug, fin_setup, line, sort_order, active').order('sort_order');
  if (error) { console.error(error); return; }
  boards = data || [];
}

function renderLogin() {
  document.getElementById('fab').classList.add('hidden');
  document.getElementById('app').innerHTML = `
    <div class="max-w-sm mx-auto mt-6 md:mt-12">
      <h1 class="font-serif italic text-2xl md:text-3xl mb-2">Login</h1>
      <p class="text-sm text-neutral-600 mb-6">Coloca teu email. A gente manda um código de 6 dígitos (e um link) pra você entrar.</p>

        <input name="email" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com" required
               class="w-full border border-black/20 bg-white px-4 py-3 focus:outline-none focus:border-black">
        <button class="w-full bg-black text-white py-3 uppercase tracking-widest text-xs hover:opacity-80 active:opacity-70">
          Enviar código
        </button>
      </form>

      <form id="codeForm" class="space-y-3 hidden mt-3">
        <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="Código de 6 dígitos"
               class="w-full border border-black/20 bg-white px-4 py-3 tracking-[0.4em] text-center text-lg focus:outline-none focus:border-black">
        <button class="w-full bg-black text-white py-3 uppercase tracking-widest text-xs hover:opacity-80 active:opacity-70">
          Entrar
        </button>
        <button type="button" id="resend" class="w-full text-[11px] uppercase tracking-widest text-neutral-500 underline">Reenviar / trocar email</button>
      </form>

      <p id="loginMsg" class="text-xs text-neutral-600 min-h-[1em] mt-3"></p>
    </div>
  `;
  const emailForm = document.getElementById('emailForm');
  const codeForm = document.getElementById('codeForm');
  const msg = document.getElementById('loginMsg');
  let currentEmail = '';

  emailForm.onsubmit = async (e) => {
    e.preventDefault();
    currentEmail = emailForm.email.value.trim();
    msg.textContent = 'Enviando…';
    const { error } = await supa.auth.signInWithOtp({
      email: currentEmail,
      options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname }
    });
    if (error) { msg.textContent = 'Erro: ' + error.message; return; }
    emailForm.classList.add('hidden');
    codeForm.classList.remove('hidden');
    codeForm.code.focus();
    msg.textContent = 'Código enviado pra ' + currentEmail + '. Digite os 6 dígitos do email (ou clique no link do email).';
  };

  codeForm.onsubmit = async (e) => {
    e.preventDefault();
    const token = codeForm.code.value.trim();
    if (token.length < 6) { msg.textContent = 'Digite os 6 dígitos.'; return; }
    msg.textContent = 'Verificando…';
    const { error } = await supa.auth.verifyOtp({ email: currentEmail, token, type: 'email' });
    if (error) { msg.textContent = 'Código inválido ou expirado: ' + error.message; return; }
    msg.textContent = 'Entrando…';
    init();   // sessão criada -> recarrega o painel
  };

  document.getElementById('resend').onclick = () => {
    codeForm.classList.add('hidden');
    emailForm.classList.remove('hidden');
    msg.textContent = '';
  };
}

async function savePost(e, existing) {
  e.preventDefault();
  const msg = document.getElementById('postMsg');
  const btn = document.querySelector('button[type=submit][form=postForm]');
  msg.textContent = 'Salvando…'; if (btn) btn.disabled = true;
  try {
    const fd = new FormData(e.target);
    const title = fd.get('title').trim();
    let slug = (fd.get('slug') || '').trim() || slugify(title);
    let cover_image = existing ? existing.cover_image : '';
    const file = fd.get('cover');
    if (file && file.size) {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const name = `post-${slug}-${Date.now()}.${ext}`;
      const { error: upErr } = await supa.storage.from('boards').upload(name, file, { contentType: file.type, upsert: false });
      if (upErr) throw upErr;
      cover_image = name;
    }
    const payload = {
      slug, title,
      lang: fd.get('lang') || 'pt',
      excerpt: (fd.get('excerpt') || '').trim(),
      read_minutes: parseInt(fd.get('read_minutes') || '5', 10) || 5,
      cover_image,
      body: fd.get('body') || '',
      published: fd.get('published') === 'on',
    };
    let error;
    if (existing) ({ error } = await supa.from('posts').update(payload).eq('id', existing.id));
    else ({ error } = await supa.from('posts').insert(payload));
    if (error) throw error;
    await loadBlogPosts();
    renderBlogView();
    closeModal();
  } catch (err) {
    msg.textContent = 'Erro: ' + (err.message || err);
    if (btn) btn.disabled = false;
  }
}

async function deletePost(id) {
  if (!confirm('Excluir este artigo permanentemente?')) return;
  const { error } = await supa.from('posts').delete().eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  await loadBlogPosts();
  renderBlogView();
  closeModal();
}

            <input type="file" accept="image/*" class="hidden" onchange="uploadSlotImage('${s.slot}', ${i}, this)">
          </label>
          ${rec ? `<button onclick="clearSlotImage('${rec.id}')" class="w-full mt-1 text-[10px] uppercase tracking-widest text-red-600 hover:opacity-70">Remover</button>` : ''}
        </div>
      `);
    }
    return `
      <div class="mb-8">
        <p class="font-medium text-sm mb-1">${s.label}</p>
        <p class="text-[10px] uppercase tracking-widest text-neutral-400 mb-3">${s.slot} · ${s.count>1?s.count+' fotos':'1 foto'}</p>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">${cells.join('')}</div>
      </div>
    `;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="max-w-4xl">
      <p class="text-sm text-neutral-600 mb-1">Troque as fotos de cada seção do site. Sem foto enviada, usa a imagem padrão.</p>
      <p class="text-xs text-neutral-400 mb-6">As mudanças aparecem no site ao recarregar a página.</p>
      ${blocks}
      <p id="imgMsg" class="text-xs text-neutral-600 min-h-[1em]"></p>
    </div>
  `;
}

async function uploadSlotImage(slot, index, inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const msg = document.getElementById('imgMsg');
  msg.textContent = 'Enviando…';
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const name = `site-${slot}-${index}-${Date.now()}.${ext}`;
    const { error: upErr } = await supa.storage.from('boards').upload(name, file, { contentType: file.type, upsert: false });
    if (upErr) throw upErr;
    // remove registro anterior nesse slot/posição, se houver
    const existing = (siteImages[slot] || [])[index];
    if (existing) await supa.from('site_images').delete().eq('id', existing.id);
    const { error } = await supa.from('site_images').insert({ slot, sort_order: index, image_path: name });
    if (error) throw error;
    await loadSiteImages();
    renderImagesView();
  } catch (e) {
    msg.textContent = 'Erro: ' + (e.message || e);
  }
}

async function clearSlotImage(id) {
  if (!confirm('Voltar à imagem padrão do site nesse espaço?')) return;
  const all = Object.values(siteImages).flat();
  const rec = all.find(r => r.id === id);
  const { error } = await supa.from('site_images').delete().eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  if (rec) await supa.storage.from('boards').remove([rec.image_path]).catch(()=>{});
  await loadSiteImages();
  renderImagesView();
}

function renderBoardsView() {
  document.getElementById('tabBody').innerHTML = `
    <div class="flex justify-between items-end gap-3 mb-5">
      <p class="text-xs text-neutral-500">Total: <span id="totalCount">—</span></p>
      <button onclick="openNew()" class="hidden md:inline-flex bg-black text-white px-5 py-3 uppercase tracking-widest text-[11px] hover:opacity-80">+ Nova prancha</button>
    </div>
    <div id="filters" class="flex flex-nowrap md:flex-wrap gap-2 mb-5 md:mb-6 overflow-x-auto -mx-4 px-4 md:mx-0 md:px-0 pb-1"></div>
    <div id="boardsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4"></div>
  `;
  renderFilters();
  renderBoards();
}

// ============================================================
// CATEGORIAS
// ============================================================
function renderCategoriesView() {
  const rows = categories.map((c, i) => `
    <div class="flex items-center gap-3 border border-black/10 bg-white px-3 py-3">
      <div class="flex flex-col">
        <button onclick="moveCategory('${c.slug}',-1)" ${i===0?'disabled':''} class="text-neutral-400 hover:text-black disabled:opacity-20 leading-none">▲</button>
        <button onclick="moveCategory('${c.slug}',1)" ${i===categories.length-1?'disabled':''} class="text-neutral-400 hover:text-black disabled:opacity-20 leading-none">▼</button>
      </div>
      <div class="flex-1 min-w-0">
        <input value="${esc(c.name)}" onchange="renameCategory('${c.slug}', this.value)"
               class="w-full font-medium bg-transparent border-b border-transparent hover:border-black/20 focus:border-black focus:outline-none py-1"/>
        <p class="text-[10px] uppercase tracking-widest text-neutral-400 mt-0.5">${c.slug}</p>
      </div>
      <label class="flex items-center gap-1.5 text-[11px] text-neutral-600 shrink-0">
        <input type="checkbox" ${c.active?'checked':''} onchange="toggleCategory('${c.slug}', this.checked)" class="w-4 h-4"> ativa
      </label>
      <button onclick="deleteCategory('${c.slug}')" class="text-red-600 text-lg hover:opacity-70 shrink-0" title="Excluir">×</button>
    </div>
  `).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="max-w-2xl space-y-2">
      <p class="text-sm text-neutral-600 mb-4">Renomeie no campo, reordene com as setas, ative/desative ou exclua. A ordem e os nomes aparecem nos filtros do site.</p>
      ${rows}
      <form id="newCatForm" class="flex gap-2 pt-4">
        <input name="name" placeholder="Nova categoria (ex: Gun)" required class="flex-1 border border-black/20 px-3 py-3"/>
        <button class="bg-black text-white px-5 py-3 uppercase tracking-widest text-[11px] hover:opacity-80">Adicionar</button>
      </form>
      <p id="catMsg" class="text-xs text-neutral-600 min-h-[1em] pt-1"></p>
    </div>
  `;
  document.getElementById('newCatForm').onsubmit = addCategory;
}

function slugify(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || ('cat-' + categories.length);
}

async function addCategory(e) {
  e.preventDefault();
  const name = e.target.name.value.trim();
  if (!name) return;
  const msg = document.getElementById('catMsg');
  const maxOrder = categories.reduce((m,c)=>Math.max(m, c.display_order||0), 0);
  const slug = slugify(name);
  msg.textContent = 'Salvando…';
  const { error } = await supa.from('categories').insert({ slug, name, display_order: maxOrder+1, active: true });
  if (error) { msg.textContent = 'Erro: ' + error.message; return; }
  await loadCategories(); renderCategoriesView();
}

async function renameCategory(slug, name) {
  await supa.from('categories').update({ name: name.trim() }).eq('slug', slug);
  await loadCategories();
}

async function toggleCategory(slug, active) {
  await supa.from('categories').update({ active }).eq('slug', slug);
  await loadCategories(); renderCategoriesView();
}

async function moveCategory(slug, dir) {
  const i = categories.findIndex(c => c.slug === slug);
  const j = i + dir;
  if (j < 0 || j >= categories.length) return;
  const a = categories[i], b = categories[j];
  await Promise.all([
    supa.from('categories').update({ display_order: b.display_order }).eq('slug', a.slug),
    supa.from('categories').update({ display_order: a.display_order }).eq('slug', b.slug),
  ]);
  await loadCategories(); renderCategoriesView();
}

async function deleteCategory(slug) {
  const used = boards.filter(b => b.category_slug === slug).length;
  if (!confirm(used ? `Há ${used} prancha(s) nessa categoria. Elas ficam sem categoria. Excluir mesmo assim?` : 'Excluir esta categoria?')) return;
  const { error } = await supa.from('categories').delete().eq('slug', slug);
  if (error) { alert('Erro: ' + error.message); return; }
  await Promise.all([loadCategories(), loadBoards()]); renderCategoriesView();
}

// ============================================================
// TEXTOS DO SITE
// ============================================================
function renderTextsView() {
  const blocks = TEXT_SCHEMA.map(t => `
    <div class="border border-black/10 bg-white p-4">
      <p class="font-medium text-sm mb-1">${t.label}</p>
      <p class="text-[10px] uppercase tracking-widest text-neutral-400 mb-3">${t.key}</p>
      <div class="space-y-3">
        ${LANGS.map(l => {
          const v = (siteTexts[l.code] && siteTexts[l.code][t.key]) || '';
          const field = t.multiline
            ? `<textarea data-key="${t.key}" data-lang="${l.code}" rows="2" class="w-full border border-black/20 px-3 py-2 text-sm">${esc(v)}</textarea>`
            : `<input data-key="${t.key}" data-lang="${l.code}" value="${esc(v)}" class="w-full border border-black/20 px-3 py-2 text-sm"/>`;
          return `<label class="block"><span class="text-[10px] uppercase tracking-widest text-neutral-500">${l.name}</span>${field}</label>`;
        }).join('')}
      </div>
    </div>
  `).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="max-w-2xl">
      <p class="text-sm text-neutral-600 mb-2">Edite os textos do site em cada idioma. Deixe em branco pra usar o texto padrão do site.</p>
      <p class="text-xs text-neutral-400 mb-6">As mudanças aparecem no site ao recarregar a página.</p>
      <div class="space-y-3">${blocks}</div>
      <div class="sticky bottom-0 bg-neutral-50 py-4 mt-2 flex items-center gap-3">
        <button onclick="saveTexts()" class="bg-black text-white px-6 py-3 uppercase tracking-widest text-[11px] hover:opacity-80">Salvar textos</button>
        <span id="textsMsg" class="text-xs text-neutral-600"></span>
      </div>
    </div>
  `;
}

async function saveTexts() {
  const msg = document.getElementById('textsMsg');
  msg.textContent = 'Salvando…';
  const fields = document.querySelectorAll('#tabBody [data-key]');
  const rows = [];
  fields.forEach(f => rows.push({ key: f.getAttribute('data-key'), lang: f.getAttribute('data-lang'), value: f.value }));
  const { error } = await supa.from('site_texts').upsert(rows, { onConflict: 'key,lang' });
  if (error) { msg.textContent = 'Erro: ' + error.message; return; }
  await loadSiteTexts();
  msg.textContent = 'Salvo ✓';
}

function renderFilters() {
  const c = document.getElementById('filters');
  const chips = [{ slug: 'Todas', name: 'Todas' }, ...categories.filter(x => x.active), { slug: '_inactive', name: 'Inativas' }];
  c.innerHTML = chips.map(x => `
    <button onclick="setFilter('${x.slug}')"
            class="filter-chip shrink-0 ${filter === x.slug ? 'bg-black text-white' : 'bg-white text-black hover:bg-neutral-100'} border border-black/20 px-3 py-2 uppercase tracking-widest text-[11px]">
      ${x.name}
    </button>
  `).join('');
}

function setFilter(slug) {
  filter = slug;
  renderFilters();
  renderBoards();
}

function visibleBoards() {
  if (filter === 'Todas') return boards.filter(b => b.active);
  if (filter === '_inactive') return boards.filter(b => !b.active);
  return boards.filter(b => b.active && b.category_slug === filter);
}

function renderBoards() {
  const grid = document.getElementById('boardsGrid');
  const list = visibleBoards();
  document.getElementById('totalCount').textContent = list.length;
  if (list.length === 0) {
    grid.innerHTML = `<div class="col-span-full text-sm text-neutral-500 py-8">Nenhuma prancha nesse filtro.</div>`;
    return;
  }
  grid.innerHTML = list.map(b => `
    <button onclick="openEdit('${b.id}')"
            class="text-left border border-black/10 bg-white hover:border-black/40 active:border-black ${b.active ? '' : 'opacity-50'} transition-colors">
      <div class="aspect-square overflow-hidden bg-neutral-100">
        <img src="${boardImg(b.image_path)}" loading="lazy" class="w-full h-full object-cover">
      </div>
      <div class="p-2.5 md:p-3 text-xs md:text-sm">
        <div class="font-medium">${slugName(b.category_slug)}</div>
        <div class="text-neutral-500 truncate">${b.fin_setup || '—'}</div>
        ${b.line ? `<div class="text-[10px] uppercase tracking-widest text-black mt-1">${b.line}</div>` : ''}
        ${!b.active ? '<div class="text-red-600 text-[10px] uppercase tracking-widest mt-1">Inativa</div>' : ''}
      </div>
    </button>
  `).join('');
}

function slugName(slug) {
  const c = categories.find(x => x.slug === slug);
  return c ? c.name : (slug || '—');
}

// ============================================================
// MODAL (new / edit) — bottom-sheet no mobile, modal no desktop
// ============================================================
function openNew() { openModal(null); }
function openEdit(id) { openModal(boards.find(b => b.id === id)); }

function openModal(board) {
  const isNew = !board;
  const m = document.getElementById('modal');
  m.classList.remove('hidden');
  m.className = 'fixed inset-0 z-50 overflow-y-auto';
  document.body.style.overflow = 'hidden';
  m.innerHTML = `
    <div class="overlay-in fixed inset-0 bg-black/50" onclick="closeModal()"></div>
    <div class="relative min-h-full flex items-end md:items-center justify-center md:p-4 pointer-events-none">
      <div class="sheet-in pointer-events-auto bg-white w-full md:max-w-md md:my-8 shadow-xl max-h-[92vh] md:max-h-none flex flex-col">
        <div class="flex justify-between items-center px-5 md:px-6 pt-5 pb-4 border-b border-black/10 sticky top-0 bg-white z-10">
          <h2 class="font-serif italic text-lg md:text-xl">${isNew ? 'Nova prancha' : 'Editar prancha'}</h2>
          <button onclick="closeModal()" class="text-3xl leading-none text-neutral-400 hover:text-black w-10 h-10 flex items-center justify-center -mr-2" aria-label="Fechar">×</button>
        </div>
        <div class="overflow-y-auto flex-1">
          <form id="boardForm" class="p-5 md:p-6 space-y-4">
            ${!isNew ? `<img src="${boardImg(board.image_path)}" class="w-full max-h-48 md:max-h-64 object-contain bg-neutral-100">` : ''}
            <label class="block">
              <span class="text-[10px] uppercase tracking-widest text-neutral-500">${isNew ? 'Imagem' : 'Trocar imagem (opcional)'}</span>
              <input type="file" name="image" accept="image/*" class="block mt-2 w-full text-sm file:mr-3 file:py-2 file:px-3 file:border file:border-black/20 file:bg-white file:text-xs file:uppercase file:tracking-widest file:cursor-pointer" ${isNew ? 'required' : ''}>
            </label>
            <label class="block">
              <span class="text-[10px] uppercase tracking-widest text-neutral-500">Categoria</span>
              <select name="category_slug" class="w-full border border-black/20 px-3 py-3 mt-1 bg-white" required>
                ${categories.filter(c => c.active).map(c => `<option value="${c.slug}" ${board && board.category_slug === c.slug ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </label>
            <label class="block">
              <span class="text-[10px] uppercase tracking-widest text-neutral-500">Quilhas</span>
              <input type="text" name="fin_setup" value="${board ? esc(board.fin_setup || '') : ''}"
                     placeholder="Thruster, Twin, Single, Quad, Twin Keel..."
                     class="w-full border border-black/20 px-3 py-3 mt-1">
            </label>
            <label class="block">
              <span class="text-[10px] uppercase tracking-widest text-neutral-500">Linha (opcional)</span>
              <input type="text" name="line" value="${board ? esc(board.line || '') : ''}"
                     placeholder="Ex: Carbon Trash"
                     class="w-full border border-black/20 px-3 py-3 mt-1">
            </label>
            <label class="flex items-center gap-3 pt-1">
              <input type="checkbox" name="active" class="w-5 h-5" ${(!board || board.active) ? 'checked' : ''}>
              <span class="text-sm">Ativa (aparece no site)</span>
            </label>
            <p id="formMsg" class="text-xs text-neutral-600 min-h-[1em]"></p>
          </form>
        </div>
        <div class="border-t border-black/10 px-5 md:px-6 py-4 pb-safe flex flex-col-reverse sm:flex-row sm:justify-between sm:items-center gap-3 bg-white">
          ${!isNew ? `<button type="button" onclick="del('${board.id}')" class="text-red-600 text-xs underline self-start sm:self-auto py-2">Excluir prancha</button>` : '<span class="hidden sm:block"></span>'}
          <div class="flex gap-2 w-full sm:w-auto">
            <button type="button" onclick="closeModal()" class="flex-1 sm:flex-none px-4 py-3 text-xs uppercase tracking-widest hover:bg-neutral-100 border border-transparent">Cancelar</button>
            <button form="boardForm" type="submit" class="flex-1 sm:flex-none bg-black text-white px-6 py-3 text-xs uppercase tracking-widest hover:opacity-80 active:opacity-70">Salvar</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('boardForm').onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const btn = document.querySelector('button[type=submit][form=boardForm]');
    msg.textContent = 'Salvando…';
    if (btn) btn.disabled = true;
    try {
      const fd = new FormData(e.target);
      let image_path = board?.image_path;
      const file = fd.get('image');
      if (file && file.size) {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const name = `upload-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await supa.storage.from('boards').upload(name, file, { contentType: file.type, upsert: false });
        if (upErr) throw upErr;
        image_path = name;
      }
      const payload = {
        image_path,
        category_slug: fd.get('category_slug'),
        fin_setup: (fd.get('fin_setup') || '').trim() || null,
        line: (fd.get('line') || '').trim() || null,
        active: fd.get('active') === 'on',
      };
      if (isNew) {
        const maxOrder = boards.reduce((m, b) => Math.max(m, b.sort_order || 0), 0);
        payload.sort_order = maxOrder + 1;
        const { error } = await supa.from('boards').insert(payload);
        if (error) throw error;
      } else {
        const { error } = await supa.from('boards').update(payload).eq('id', board.id);
        if (error) throw error;
      }
      await loadBoards();
      renderBoards();
      closeModal();
    } catch (err) {
      msg.textContent = 'Erro: ' + (err.message || err);
      if (btn) btn.disabled = false;
    }
  };
  // ESC fecha
  document.addEventListener('keydown', escClose);
}

function escClose(e) {
  if (e.key === 'Escape') closeModal();
}

function closeModal() {
  const m = document.getElementById('modal');
  m.classList.add('hidden');
  m.innerHTML = '';
  document.body.style.overflow = '';
  document.removeEventListener('keydown', escClose);
}

async function del(id) {
  if (!confirm('Excluir esta prancha permanentemente?')) return;
  const b = boards.find(x => x.id === id);
  const { error } = await supa.from('boards').delete().eq('id', id);
  if (error) { alert('Erro: ' + error.message); return; }
  if (b && b.image_path) {
    await supa.storage.from('boards').remove([b.image_path]).catch(() => {});
  }
  await loadBoards();
  renderBoards();
  closeModal();
}

async function logout() {
  await supa.auth.signOut();
  location.reload();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

init();
</script>
</body></html>
