<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sua proposta | Baltazar Customs Surfboards</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="description" content="Proposta da sua prancha sob medida Baltazar Customs."/>
<meta property="og:title" content="Sua proposta | Baltazar Customs"/>
<meta property="og:description" content="A sua prancha sob medida, revisada pelo shaper. Confira e dê o seu de acordo."/>
<meta property="og:image" content="https://www.baltazarcustomssurfboards.com/images/og-cover.jpg"/>
<link rel="icon" type="image/png" href="/images/favicon.png"/>
<meta name="theme-color" content="#f9f9f9"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Work Sans', sans-serif; }
.font-serif { font-family: 'Newsreader', serif; font-optical-sizing: auto; letter-spacing: -0.015em; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
</style>
</head>
<body class="bg-[#f9f9f9] text-[#1a1c1c]">

<header class="px-5 md:px-10 py-4 md:py-6 border-b border-black/10">
  <div class="max-w-3xl mx-auto flex justify-between items-center">
    <a href="/" aria-label="Baltazar Customs Surfboards"><img src="/images/brand/logo-oval-black.png" alt="Baltazar Customs Surfboards" width="200" height="86" class="h-9 md:h-11 w-auto"/></a>
    <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">Proposta</span>
  </div>
</header>

<main id="app" class="max-w-3xl mx-auto px-5 md:px-10 py-12 md:py-20">
  <p class="font-sans text-sm text-neutral-500">Carregando a sua proposta…</p>
</main>

<footer class="border-t border-black/10 px-5 md:px-10 py-10">
  <div class="max-w-3xl mx-auto font-sans text-xs text-neutral-500 leading-relaxed">
    Baltazar Customs Surfboards · feitas à mão no Recreio, Rio de Janeiro.<br/>
    Dúvidas sobre a proposta? Responda a mensagem em que você recebeu este link.
  </div>
</footer>

<script>
const SUPABASE_URL = 'https://eylnwwerbssfaaaxsccw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bG53d2VyYnNzZmFhYXhzY2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDU3NjYsImV4cCI6MjA5NzI4MTc2Nn0.XMYTNxGEj5Jjt89Q9GCQasnD9sR9q0lt4wdlXUNrJgc';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const IMG = SUPABASE_URL + '/storage/v1/object/public/boards/';
const app = document.getElementById('app');

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function brl(n) { return 'R$ ' + Number(n || 0).toLocaleString('pt-BR'); }
function img(p) { return !p ? '' : (/^(https?:|\/)/.test(p) ? p : IMG + p); }
function data(d) { return new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'America/Sao_Paulo' }); }
function first(n) { return String(n || '').trim().split(/\s+/)[0]; }

function notFound() {
  app.innerHTML = `
    <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">Proposta</span>
    <h1 class="font-serif text-4xl md:text-6xl leading-tight mt-3 mb-6">Não encontramos essa proposta.</h1>
    <p class="font-sans text-neutral-600 leading-relaxed max-w-lg">Confira se o link chegou completo. Se o problema continuar, responda a mensagem em que você recebeu o link que a gente resolve.</p>`;
}

function spec(label, value) {
  if (!value) return '';
  return `<div class="py-4 border-t border-black/10 grid grid-cols-[8rem_1fr] md:grid-cols-[10rem_1fr] gap-4">
    <dt class="font-sans uppercase text-[10px] tracking-widest text-neutral-500 pt-0.5">${label}</dt>
    <dd class="font-sans text-sm md:text-base text-neutral-800 leading-relaxed">${esc(value)}</dd></div>`;
}

function render(p) {
  document.title = 'Proposta de ' + first(p.cliente_nome) + ' | Baltazar Customs';
  const foto = img(p.imagem);
  const temDesconto = p.desconto_pct > 0 && p.preco_tabela > p.preco_final;
  const aceita = p.status === 'aceita';
  app.innerHTML = `
    <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">Sua proposta${p.lead_pedido ? ' · Pedido ' + esc(p.lead_pedido) : ''}</span>
    <h1 class="font-serif text-4xl md:text-6xl leading-[1.05] mt-3">Olá, ${esc(first(p.cliente_nome))}. Sua prancha está pronta pra sair do papel.</h1>
    <p class="font-sans text-base md:text-lg text-neutral-600 leading-relaxed mt-5 max-w-xl">O shaper revisou o seu pedido. Confira abaixo como ela vai ficar e o valor final. Estando tudo certo, é só dar o seu de acordo.</p>

    <section id="propCard" class="mt-12 md:mt-16 bg-white border border-black/10 grid md:grid-cols-[16rem_1fr]">
      <div id="propFoto" class="bg-[#f3f1ed] flex items-center justify-center p-4 md:p-5 ${foto ? '' : 'min-h-[14rem]'}">
        ${foto ? `<img src="${esc(foto)}" alt="${esc(p.modelo)}" class="block w-auto max-w-full h-auto max-h-[30rem] md:max-h-[34rem] object-contain"/>`
               : `<img src="/images/brand/motif-tiger.png" alt="" class="w-40 opacity-90"/>`}
      </div>
      <div class="p-6 md:p-8">
        <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">Modelo</span>
        <h2 class="font-serif text-3xl md:text-4xl leading-tight mt-1">${esc(p.modelo)}</h2>
        ${p.detalhes ? `<p class="font-sans text-sm text-neutral-600 mt-2">${esc(p.detalhes)}</p>` : ''}
        <dl class="mt-6">
          ${spec('Tamanho', p.tamanho)}${spec('Medidas', p.medidas)}${spec('Pintura', p.pintura)}${spec('Quilhas', p.quilhas)}${spec('Observações', p.observacoes)}${spec('Prazo', p.prazo)}
        </dl>
      </div>
    </section>

    ${p.nota_shaper ? `
    <section class="mt-10 md:mt-14">
      <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">Palavra do shaper</span>
      <blockquote class="font-serif text-2xl md:text-3xl leading-snug mt-3">“${esc(p.nota_shaper)}”</blockquote>
      <p class="font-sans text-xs uppercase tracking-widest text-neutral-500 mt-4">César Baltazar</p>
    </section>` : ''}

    <section class="mt-10 md:mt-14 bg-black text-white p-6 md:p-8">
      <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-white/60">Valor</span>
      ${temDesconto ? `
        <div class="flex justify-between font-sans text-sm text-white/70 mt-4"><span>Valor de tabela (${esc(p.tamanho || p.modelo)})</span><span class="line-through">${brl(p.preco_tabela)}</span></div>
        <div class="flex justify-between font-sans text-sm text-white/70 mt-2"><span>Desconto ${p.desconto_pct}%${p.cupom ? ' · cupom ' + esc(p.cupom) : ''}</span><span>− ${brl(p.preco_tabela - p.preco_final)}</span></div>` : ''}
      <div class="flex justify-between items-end mt-5 pt-5 border-t border-white/20">
        <span class="font-sans text-sm uppercase tracking-widest">Total</span>
        <span class="font-serif text-4xl md:text-5xl">${brl(p.preco_final)}</span>
      </div>
      <p class="font-sans text-xs text-white/60 mt-4 leading-relaxed">O link de pagamento é enviado depois do seu de acordo.</p>
    </section>

    <section id="aceite" class="mt-10 md:mt-14"></section>`;
  renderAceite(p);
  ajustaFoto();
}

// A foto nunca é cortada. Vertical (o normal de prancha): coluna ao lado,
// inteira. Horizontal: vai pra cima, na largura do cartão.
function ajustaFoto() {
  const card = document.getElementById('propCard'), box = document.getElementById('propFoto');
  const im = box && box.querySelector('img'); if (!im) return;
  const aplica = () => {
    if (!im.naturalWidth) return;
    const horizontal = im.naturalWidth > im.naturalHeight * 1.15;
    card.style.gridTemplateColumns = horizontal ? '1fr' : '';
    card.dataset.foto = horizontal ? 'horizontal' : 'vertical';
    im.style.maxHeight = horizontal ? '26rem' : '';
  };
  if (im.complete) aplica(); else im.addEventListener('load', aplica);
}

function renderAceite(p) {
  const box = document.getElementById('aceite');
  if (p.status === 'aceita') {
    box.innerHTML = `
      <div class="border border-black/15 bg-white p-6 md:p-8">
        <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">De acordo</span>
        <h2 class="font-serif text-3xl md:text-4xl leading-tight mt-2">Tudo certo, ${esc(first(p.aceito_nome || p.cliente_nome))}.</h2>
        <p class="font-sans text-sm md:text-base text-neutral-600 leading-relaxed mt-3">Você deu o seu de acordo${p.aceito_em ? ' em ' + data(p.aceito_em) : ''}. Em breve a gente te envia o link de pagamento, e a sua prancha entra na fila do shaper.</p>
      </div>`;
    return;
  }
  box.innerHTML = `
    <form id="aceiteForm" class="border border-black/15 bg-white p-6 md:p-8" novalidate>
      <span class="font-sans uppercase text-[10px] tracking-[0.2em] text-neutral-500">De acordo</span>
      <h2 class="font-serif text-3xl md:text-4xl leading-tight mt-2">Está tudo como você quer?</h2>
      <p class="font-sans text-sm text-neutral-600 leading-relaxed mt-3">Se quiser mudar alguma coisa, é só responder a mensagem em que recebeu este link. Se estiver tudo certo, confirme abaixo.</p>
      <label class="block mt-6">
        <span class="font-sans text-[10px] uppercase tracking-widest text-neutral-500">Seu nome</span>
        <input name="nome" value="${esc(p.cliente_nome)}" autocomplete="name" class="w-full border-b border-black/30 focus:border-black bg-transparent py-2 text-base focus:outline-none"/>
      </label>
      <label class="flex gap-3 items-start mt-5 cursor-pointer">
        <input type="checkbox" name="ok" class="mt-1 w-4 h-4 accent-black"/>
        <span class="font-sans text-sm text-neutral-700 leading-relaxed">Li a proposta e estou de acordo com o modelo, as especificações e o valor de ${brl(p.preco_final)}.</span>
      </label>
      <button type="submit" class="mt-6 w-full md:w-auto bg-black text-white px-10 py-4 font-sans uppercase tracking-widest text-[10px] hover:opacity-80 transition-opacity">Estou de acordo</button>
      <p id="aceiteMsg" class="font-sans text-xs mt-3 min-h-[1em]"></p>
    </form>`;
  document.getElementById('aceiteForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const f = e.target, msg = document.getElementById('aceiteMsg'), btn = f.querySelector('button');
    const nome = f.nome.value.trim();
    if (!nome) { msg.style.color = '#b00020'; msg.textContent = 'Escreva o seu nome.'; return; }
    if (!f.ok.checked) { msg.style.color = '#b00020'; msg.textContent = 'Marque a caixa confirmando que está de acordo.'; return; }
    btn.disabled = true; btn.textContent = 'Enviando...'; msg.textContent = '';
    try {
      const r = await fetch('/api/proposta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: p.id, nome: nome }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.error || 'erro');
      renderAceite(Object.assign({}, p, { status: 'aceita', aceito_em: d.aceito_em, aceito_nome: d.aceito_nome || nome }));
      document.getElementById('aceite').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Estou de acordo';
      msg.style.color = '#b00020'; msg.textContent = 'Não conseguimos registrar agora. Tente de novo em instantes.';
    }
  });
}

(async function () {
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f-]{36}$/i.test(t)) { notFound(); return; }
  try {
    const { data, error } = await supa.rpc('get_proposal', { t: t });
    if (error || !data || !data.length) { notFound(); return; }
    render(data[0]);
  } catch (e) { notFound(); }
})();
</script>
</body></html>
